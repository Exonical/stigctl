name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format sources
        run: gofmt -w $(find . -name '*.go' -type f)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build self-contained binary
        run: go build -o bin/stigctl ./cmd/stigctl

      - name: Upload stigctl binary
        uses: actions/upload-artifact@v7
        with:
          name: stigctl-linux-amd64
          path: bin/stigctl
          if-no-files-found: error

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  release-config:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

  cklb-golden:
    name: CKLB golden compatibility
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download authoritative RHEL 9 V2R9 STIG
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/U_RHEL_9_V2R9_STIG.zip \
            https://dl.dod.cyber.mil/wp-content/uploads/stigs/zip/U_RHEL_9_V2R9_STIG.zip
          echo "1875de2543d01695c5a346c51888cc336113e9199bfe6726d74a08de286ca1ae  /tmp/U_RHEL_9_V2R9_STIG.zip" \
            | sha256sum --check -
          mkdir -p /tmp/rhel9-v2r9
          unzip -j /tmp/U_RHEL_9_V2R9_STIG.zip '*xccdf.xml' -d /tmp/rhel9-v2r9
          test -f /tmp/rhel9-v2r9/U_RHEL_9_STIG_V2R9_Manual-xccdf.xml

      - name: Compare generated CKLB with real STIG Viewer 3 export
        env:
          STIGCTL_GOLDEN_XCCDF: /tmp/rhel9-v2r9/U_RHEL_9_STIG_V2R9_Manual-xccdf.xml
          STIGCTL_GOLDEN_OUTPUT: /tmp/cklb-artifacts/generated-rhel9-v2r9.cklb
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/cklb-artifacts

          status=0
          go test ./internal/export/cklb \
            -run '^TestRHEL9V2R9GoldenCKLB
  rocky9-stig:
    name: Apply and validate RHEL 9 STIG on Rocky Linux 9
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Download stigctl binary
        uses: actions/download-artifact@v8
        with:
          name: stigctl-linux-amd64
          path: bin

      - name: Verify downloaded binary
        run: |
          chmod +x bin/stigctl
          ./bin/stigctl --help >/dev/null

      - name: Pull Rocky Linux 9
        run: docker pull rockylinux/rockylinux:9

      - name: Apply and validate STIG in Rocky Linux 9 container
        run: |
          docker run --rm \
            --privileged \
            --hostname stigctl-rocky9-ci \
            -v "$PWD:/workspace" \
            -w /workspace \
            rockylinux/rockylinux:9 \
            /bin/bash -euxo pipefail -c '
              cat /etc/os-release

              # Exercise the embedded Yip engine.
              ./bin/stigctl apply rhel9:v2r9 --profile container-ci

              # Verify representative remediations changed the container.
              rpm -q firewalld
              rpm -q chrony
              rpm -q openssh-clients
              rpm -q usbguard
              rpm -q aide
              rpm -q rsyslog
              rpm -q audit
              rpm -q crypto-policies

              ! rpm -q sendmail
              ! rpm -q telnet-server
              ! rpm -q ypserv
              ! rpm -q quagga

              # Exercise the embedded Goss engine against the same remediated
              # container filesystem.
              ./bin/stigctl validate rhel9:v2r9 \
                --profile container-ci \
                --fail-on-findings
            '

  bootstrap-v0-0-1:
    name: Bootstrap v0.0.1
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
      - release-config
      - rocky9-stig
      - cklb-golden
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create v0.0.1 tag
        env:
          TAG: v0.0.1
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "stigctl ${TAG}"
          git push origin "${TAG}"

      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.0.1
        run: gh workflow run release.yml --ref main -f tag="${TAG}"
 \
            -count=1 \
            -v 2>&1 | tee /tmp/cklb-artifacts/golden-test.log || status=$?

          if [[ -f /tmp/cklb-artifacts/generated-rhel9-v2r9.cklb ]]; then
            sha256sum /tmp/cklb-artifacts/generated-rhel9-v2r9.cklb \
              > /tmp/cklb-artifacts/generated-rhel9-v2r9.cklb.sha256
          fi

          exit "$status"

      - name: Upload CKLB review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cklb-rhel9-v2r9-${{ github.sha }}
          path: /tmp/cklb-artifacts/
          if-no-files-found: warn
          retention-days: 30

  rocky9-stig:
    name: Apply and validate RHEL 9 STIG on Rocky Linux 9
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Download stigctl binary
        uses: actions/download-artifact@v8
        with:
          name: stigctl-linux-amd64
          path: bin

      - name: Verify downloaded binary
        run: |
          chmod +x bin/stigctl
          ./bin/stigctl --help >/dev/null

      - name: Pull Rocky Linux 9
        run: docker pull rockylinux/rockylinux:9

      - name: Apply and validate STIG in Rocky Linux 9 container
        run: |
          docker run --rm \
            --privileged \
            --hostname stigctl-rocky9-ci \
            -v "$PWD:/workspace" \
            -w /workspace \
            rockylinux/rockylinux:9 \
            /bin/bash -euxo pipefail -c '
              cat /etc/os-release

              # Exercise the embedded Yip engine.
              ./bin/stigctl apply rhel9:v2r9 --profile container-ci

              # Verify representative remediations changed the container.
              rpm -q firewalld
              rpm -q chrony
              rpm -q openssh-clients
              rpm -q usbguard
              rpm -q aide
              rpm -q rsyslog
              rpm -q audit
              rpm -q crypto-policies

              ! rpm -q sendmail
              ! rpm -q telnet-server
              ! rpm -q ypserv
              ! rpm -q quagga

              # Exercise the embedded Goss engine against the same remediated
              # container filesystem.
              ./bin/stigctl validate rhel9:v2r9 \
                --profile container-ci \
                --fail-on-findings
            '

  bootstrap-v0-0-1:
    name: Bootstrap v0.0.1
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
      - release-config
      - rocky9-stig
      - cklb-golden
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create v0.0.1 tag
        env:
          TAG: v0.0.1
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "stigctl ${TAG}"
          git push origin "${TAG}"

      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.0.1
        run: gh workflow run release.yml --ref main -f tag="${TAG}"
