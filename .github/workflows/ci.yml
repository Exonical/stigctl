name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format sources
        run: gofmt -w $(find . -name '*.go' -type f)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build self-contained binary
        run: go build -o bin/stigctl ./cmd/stigctl

      - name: Upload stigctl binary
        uses: actions/upload-artifact@v7
        with:
          name: stigctl-linux-amd64
          path: bin/stigctl
          if-no-files-found: error



  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2


  release-config:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

  rocky9-stig:
    name: Apply and validate RHEL 9 STIG on Rocky Linux 9
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Download stigctl binary
        uses: actions/download-artifact@v8
        with:
          name: stigctl-linux-amd64
          path: bin

      - name: Verify downloaded binary
        run: |
          chmod +x bin/stigctl
          ./bin/stigctl --help >/dev/null

      - name: Pull Rocky Linux 9
        run: docker pull rockylinux/rockylinux:9

      - name: Apply and validate STIG in Rocky Linux 9 container
        run: |
          docker run --rm \
            --privileged \
            --hostname stigctl-rocky9-ci \
            -v "$PWD:/workspace" \
            -w /workspace \
            rockylinux/rockylinux:9 \
            /bin/bash -euxo pipefail -c '
              cat /etc/os-release

              # Exercise the embedded Yip engine.
              ./bin/stigctl apply rhel9:v2r9 --profile container-ci

              # Verify representative remediations changed the container.
              rpm -q firewalld
              rpm -q chrony
              rpm -q openssh-clients
              rpm -q usbguard
              rpm -q aide
              rpm -q rsyslog
              rpm -q audit
              rpm -q crypto-policies

              ! rpm -q sendmail
              ! rpm -q telnet-server
              ! rpm -q ypserv
              ! rpm -q quagga

              # Exercise the embedded Goss engine against the same remediated
              # container filesystem.
              ./bin/stigctl validate rhel9:v2r9 \
                --profile container-ci \
                --fail-on-findings
            '


  bootstrap-v0-0-1:
    name: Bootstrap v0.0.1
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
      - release-config
      - rocky9-stig
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check immutable releases
        id: immutable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/immutable-releases" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Immutable releases are not enabled; v0.0.1 will not be tagged."
          fi

      - name: Create v0.0.1 tag
        if: steps.immutable.outputs.enabled == 'true'
        env:
          TAG: v0.0.1
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "stigctl ${TAG}"
          git push origin "${TAG}"
