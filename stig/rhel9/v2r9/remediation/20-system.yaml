name: RHEL 9 STIG - System

stages:
  stig:
    - name: V-257784
      files:
        - path: /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf
          permissions: "0644"
          content: |
            [Manager]
            CtrlAltDelBurstAction=none
      commands:
        - systemctl daemon-reload

    - name: V-257785
      only_service_manager: systemd
      commands:
        - systemctl disable --now ctrl-alt-del.target
        - systemctl mask --now ctrl-alt-del.target

    - name: V-257955
      commands:
        - find / -name shosts.equiv -type f -delete 2>/dev/null || true

    - name: V-257956
      commands:
        - find / -name .shosts -type f -delete 2>/dev/null || true

    - name: V-258094
      commands:
        - |
          if command -v authselect >/dev/null 2>&1 && authselect current >/dev/null 2>&1; then
            authselect enable-feature without-nullok
          else
            sed -ri 's/(^|[[:space:]])nullok([[:space:]]|$)/ /g' /etc/pam.d/system-auth /etc/pam.d/password-auth 2>/dev/null || true
          fi

    - name: V-257820
      commands:
        - |
          if grep -qE '^[[:space:]]*gpgcheck[[:space:]]*=' /etc/dnf/dnf.conf; then
            sed -ri 's/^[[:space:]]*gpgcheck[[:space:]]*=.*/gpgcheck=1/' /etc/dnf/dnf.conf
          else
            printf '\ngpgcheck=1\n' >> /etc/dnf/dnf.conf
          fi

    - name: V-257821
      commands:
        - |
          if grep -qE '^[[:space:]]*localpkg_gpgcheck[[:space:]]*=' /etc/dnf/dnf.conf; then
            sed -ri 's/^[[:space:]]*localpkg_gpgcheck[[:space:]]*=.*/localpkg_gpgcheck=1/' /etc/dnf/dnf.conf
          else
            printf '\nlocalpkg_gpgcheck=1\n' >> /etc/dnf/dnf.conf
          fi

    - name: V-257822
      commands:
        - |
          for repo in /etc/yum.repos.d/*.repo; do
            test -e "$repo" || continue
            tmp="$(mktemp)"
            awk '
              function finish_section() {
                if (in_section && !saw_gpgcheck) {
                  print "gpgcheck=1"
                }
              }
              /^[[:space:]]*\[[^]]+\][[:space:]]*$/ {
                finish_section()
                print
                in_section=1
                saw_gpgcheck=0
                next
              }
              /^[[:space:]]*gpgcheck[[:space:]]*=/ {
                print "gpgcheck=1"
                saw_gpgcheck=1
                next
              }
              { print }
              END { finish_section() }
            ' "$repo" > "$tmp"
            cat "$tmp" > "$repo"
            rm -f "$tmp"
          done

    - name: V-257835
      commands:
        - dnf -y remove tftp-server || true

    - name: V-258018
      commands:
        - |
          if rpm -q gdm >/dev/null 2>&1; then
            install -d -m 0755 /etc/gdm
            test -f /etc/gdm/custom.conf || printf '[daemon]\n' > /etc/gdm/custom.conf
            if grep -qE '^[[:space:]]*AutomaticLoginEnable[[:space:]]*=' /etc/gdm/custom.conf; then
              sed -ri 's/^[[:space:]]*AutomaticLoginEnable[[:space:]]*=.*/AutomaticLoginEnable=false/' /etc/gdm/custom.conf
            else
              sed -i '/^\[daemon\]/a AutomaticLoginEnable=false' /etc/gdm/custom.conf
            fi
            sed -ri '/^[[:space:]]*AutomaticLogin[[:space:]]*=/d' /etc/gdm/custom.conf
          fi

