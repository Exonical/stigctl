name: RHEL 9 STIG - System Hardening

stages:
  stig:
    - name: V-257812
      commands:
        - |
          install -d -m 0755 /etc/systemd/coredump.conf.d; cat > /etc/systemd/coredump.conf.d/99-stig.conf <<'EOF'
          [Coredump]
          ProcessSizeMax=0
          Storage=none
          EOF

    - name: V-257813
      commands:
        - |
          install -d -m 0755 /etc/systemd/coredump.conf.d; cat > /etc/systemd/coredump.conf.d/99-stig.conf <<'EOF'
          [Coredump]
          ProcessSizeMax=0
          Storage=none
          EOF

    - name: V-257814
      commands:
        - |
          cat > /etc/security/limits.d/99-stig-core.conf <<'EOF'
          * hard core 0
          EOF

    - name: V-257815
      commands:
        - |
          systemctl disable --now systemd-coredump.socket 2>/dev/null || true; systemctl mask systemd-coredump.socket 2>/dev/null || true

    - name: V-257817
      commands:
        - |
          echo 'NX/XD is a hardware/firmware capability and cannot be enabled safely by stigctl.'

    - name: V-257823
      commands:
        - |
          packages="$(
            rpm -Va --noconfig 2>/dev/null |
              awk '$1 ~ /..5/ && $2 != "c" {print $NF}' |
              while IFS= read -r path; do rpm -qf "$path" --qf '%{NAME}\n' 2>/dev/null || true; done |
              sort -u
          )"
          test -z "$packages" || dnf -y reinstall $packages

    - name: V-257824
      commands:
        - |
          old="$(dnf repoquery --installonly --latest-limit=-2 -q 2>/dev/null || true)"; test -z "$old" || dnf -y remove $old

    - name: V-257830
      commands:
        - |
          for r in $(dnf -q repolist --enabled 2>/dev/null | awk 'tolower($1) ~ /epel/{print $1}'); do dnf config-manager --set-disabled "$r" 2>/dev/null || true; done

    - name: V-257837
      commands:
        - |
          dnf -y remove gdm 2>/dev/null || true

    - name: V-257880
      commands:
        - |
          cat > /etc/modprobe.d/cramfs.conf <<'EOF'
          install cramfs /bin/false
          blacklist cramfs
          EOF
          modprobe -r cramfs 2>/dev/null || true

    - name: V-257882
      commands:
        - |
          find /bin /sbin /usr/bin /usr/sbin -xdev -type f -perm /022 -exec chmod go-w {} +

    - name: V-257883
      commands:
        - |
          find /lib /lib64 /usr/lib /usr/lib64 -xdev -type d -perm /022 -exec chmod go-w {} +

    - name: V-257884
      commands:
        - |
          find /lib /lib64 /usr/lib /usr/lib64 -xdev -type f -perm /022 -exec chmod go-w {} +

    - name: V-257889
      commands:
        - |
          while IFS=: read -r _ _ uid _ _ home shell; do test "$uid" -ge 1000 || continue; case "$shell" in */nologin|*/false) continue;; esac; test -d "$home" || continue; find "$home" -maxdepth 1 -type f -name '.*' -perm /0037 -exec chmod go-rwx {} +; done < /etc/passwd

    - name: V-257890
      commands:
        - |
          while IFS=: read -r _ _ uid _ _ home shell; do test "$uid" -ge 1000 || continue; case "$shell" in */nologin|*/false) continue;; esac; test -d "$home" || continue; chmod go-w,o-rwx "$home"; done < /etc/passwd

    - name: V-257918
      commands:
        - |
          find /bin /sbin /usr/bin /usr/sbin -xdev -type f ! -user root -exec chown root {} +

    - name: V-257920
      commands:
        - |
          find /lib /lib64 /usr/lib /usr/lib64 -xdev -type f ! -user root -exec chown root {} +

    - name: V-257922
      commands:
        - |
          find /lib /lib64 /usr/lib /usr/lib64 -xdev -type d ! -user root -exec chown root {} +

    - name: V-257929
      commands:
        - |
          find / -xdev -type d -perm -0002 ! -perm -1000 -exec chmod a+t {} + 2>/dev/null || true

    - name: V-257930
      commands:
        - |
          for mount in $(df --local -P | awk 'NR!=1{print $6}'); do
            find "$mount" -xdev -nogroup -exec chgrp root {} + 2>/dev/null || true
          done

    - name: V-257931
      commands:
        - |
          for mount in $(df --local -P | awk 'NR!=1{print $6}'); do
            find "$mount" -xdev -nouser -exec chown root {} + 2>/dev/null || true
          done

    - name: V-257932
      commands:
        - |
          restorecon -RFv /dev 2>/dev/null || true

    - name: V-257934
      commands:
        - |
          chmod 0000 /etc/shadow

    - name: V-257941
      commands:
        - |
          ip -o link show | awk -F': ' '/PROMISC/{print $2}' | while read -r i; do ip link set dev "$i" promisc off; done

    - name: V-257946
      commands:
        - |
          sed -ri '/^[[:space:]]*allow([[:space:]]|$)/d' /etc/chrony.conf /etc/chrony.d/*.conf 2>/dev/null || true

    - name: V-257947
      commands:
        - |
          sed -ri '/^[[:space:]]*cmdallow([[:space:]]|$)/d' /etc/chrony.conf /etc/chrony.d/*.conf 2>/dev/null || true


    - name: V-257949
      commands:
        - |
          install -d -m 0755 /etc/NetworkManager/conf.d; cat > /etc/NetworkManager/conf.d/99-stig-dns.conf <<'EOF'
          [main]
          dns=default
          EOF

    - name: V-257951
      commands:
        - |
          if rpm -q postfix >/dev/null 2>&1; then postconf -e 'smtpd_client_restrictions = permit_mynetworks,reject'; systemctl reload postfix 2>/dev/null || true; fi

    - name: V-257953
      commands:
        - |
          grep -Eq '^[[:space:]]*postmaster:' /etc/aliases && sed -ri 's/^[[:space:]]*postmaster:.*/postmaster: root/' /etc/aliases || printf '\npostmaster: root\n' >> /etc/aliases; command -v newaliases >/dev/null 2>&1 && newaliases || true

    - name: V-257981
      commands:
        - |
          cat > /etc/issue <<'EOF'
          You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.
          EOF
          cat > /etc/ssh/sshd_config.d/60-stig-banner.conf <<'EOF'
          Banner /etc/issue
          EOF
          systemctl restart sshd 2>/dev/null || true

