    - name: V-257996
      commands:
        - test -f /etc/ssh/sshd_config.d/60-stig-security.conf

    - name: V-257997
      commands:
        - chgrp -R root /etc/ssh/sshd_config /etc/ssh/sshd_config.d

    - name: V-257998
      commands:
        - chown -R root /etc/ssh/sshd_config /etc/ssh/sshd_config.d

    - name: V-257999
      commands:
        - rpm --setugids openssh-server
        - rpm --setperms openssh-server

    - name: V-258000
      commands:
        - find /etc/ssh -maxdepth 1 -type f -name 'ssh_host*_key' -exec chmod 0600 {} +

    - name: V-258001
      commands:
        - find /etc/ssh -maxdepth 1 -type f -name 'ssh_host*_key.pub' -exec chmod 0644 {} +

