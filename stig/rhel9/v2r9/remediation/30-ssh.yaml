name: RHEL 9 STIG - SSH

stages:
  stig:
    - name: V-257978
      packages:
        install:
          - openssh-server

    - name: V-257979
      only_service_manager: systemd
      systemctl:
        enable:
          - sshd
        start:
          - sshd

    - name: V-257982
      files:
        - path: /etc/ssh/sshd_config.d/60-stig-security.conf
          permissions: "0600"
          content: |
            LogLevel VERBOSE
            PubkeyAuthentication yes
            PermitRootLogin no
            HostbasedAuthentication no
            PermitUserEnvironment no
            RekeyLimit 1G 1h
            ClientAliveCountMax 1
            ClientAliveInterval 600
            GSSAPIAuthentication no
            KerberosAuthentication no
            IgnoreRhosts yes
            IgnoreUserKnownHosts yes
            X11Forwarding no
            StrictModes yes
            PrintLastLog yes
            X11UseLocalhost yes
      commands:
        - systemctl restart sshd.service || true

    - name: V-257983
      commands:
        - test -f /etc/ssh/sshd_config.d/60-stig-security.conf

    - name: V-257985
      commands:
        - test -f /etc/ssh/sshd_config.d/60-stig-security.conf

    - name: V-257992
      commands:
        - test -f /etc/ssh/sshd_config.d/60-stig-security.conf

    - name: V-257993
      commands:
        - test -f /etc/ssh/sshd_config.d/60-stig-security.conf

    - name: V-257994
      commands:
