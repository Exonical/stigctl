name: RHEL 9 STIG - Mount and Filesystem Controls

stages:
  stig:
    - name: V-257849
      commands:
        - |
          systemctl disable --now autofs.service 2>/dev/null || true

    - name: V-257850
      commands:
        - |
          target='/home'
          opt='nodev'
          src="$(findmnt -n -o SOURCE --target "$target" 2>/dev/null || true)"
          fstype="$(findmnt -n -o FSTYPE --target "$target" 2>/dev/null || true)"
          opts="$(findmnt -n -o OPTIONS --target "$target" 2>/dev/null || true)"
          test -n "$src" && test -n "$fstype" || exit 0
          tmp="$(mktemp)"
          awk -v t="$target" -v o="$opt" 'BEGIN{OFS="\t"} /^[[:space:]]*#/ || NF<4 {print; next} $2==t {n=split($4,a,","); found=0; for(i=1;i<=n;i++) if(a[i]==o) found=1; if(!found) $4=$4 "," o} {print}' /etc/fstab > "$tmp"
          if grep -Eq "^[^#]+[[:space:]]+$target[[:space:]]+" /etc/fstab; then cat "$tmp" > /etc/fstab; else printf "%s\t%s\t%s\t%s,%s\t0\t0\n" "$src" "$target" "$fstype" "$opts" "$opt" >> /etc/fstab; fi
          rm -f "$tmp"
          mount -o remount,"$opt" "$target" 2>/dev/null || true

