  V-258153:
    title: "RHEL 9 audit system must take appropriate action when an error writing to the audit storage volume occurs."
    meta: { stig_id: V-258153 }
    exec: |
      value="$(awk -F= '/^[[:space:]]*disk_error_action[[:space:]]*=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' /etc/audit/auditd.conf)"
      test -n "$value" || exit 1
      printf 'disk_error_action=%s\n' "$value"
      test "$(printf '%s' "$value" | tr '[:lower:]' '[:upper:]')" = "$(printf '%s' 'HALT' | tr '[:lower:]' '[:upper:]')"
    exit-status: 0
    stdout:
      - "disk_error_action="
    skip: {{ not (index .Vars.enabled_rules "V-258153") }}


