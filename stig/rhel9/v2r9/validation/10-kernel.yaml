kernel-param:
  V-257797:
    name: kernel.dmesg_restrict
    title: "RHEL 9 must restrict access to the kernel message buffer."
    meta:
      stig_id: V-257797
    value: "1"
    skip: {{ not (index .Vars.enabled_rules "V-257797") }}
  V-257798:
    name: kernel.perf_event_paranoid
    title: "RHEL 9 must prevent kernel profiling by nonprivileged users."
    meta:
      stig_id: V-257798
    value: "2"
    skip: {{ not (index .Vars.enabled_rules "V-257798") }}
  V-257799:
    name: kernel.kexec_load_disabled
    title: "RHEL 9 must prevent the loading of a new kernel for later execution."
    meta:
      stig_id: V-257799
    value: "1"
    skip: {{ not (index .Vars.enabled_rules "V-257799") }}
  V-257800:
    name: kernel.kptr_restrict
    title: "RHEL 9 must restrict exposed kernel pointer addresses access."
    meta:
      stig_id: V-257800
    value: "1"
    skip: {{ not (index .Vars.enabled_rules "V-257800") }}
  V-257801:
    name: fs.protected_hardlinks
    title: "RHEL 9 must enable kernel parameters to enforce discretionary access control (DAC) on hardlinks."
    meta:
      stig_id: V-257801
    value: "1"
    skip: {{ not (index .Vars.enabled_rules "V-257801") }}
  V-257802:
    name: fs.protected_symlinks
    title: "RHEL 9 must enable kernel parameters to enforce discretionary access (DAC) control on symlinks."
    meta:
      stig_id: V-257802
    value: "1"
    skip: {{ not (index .Vars.enabled_rules "V-257802") }}
  V-257803:
    name: kernel.core_pattern
    title: "RHEL 9 must disable the kernel.core_pattern."
    meta:
      stig_id: V-257803
    value: "|/bin/false"
    skip: {{ not (index .Vars.enabled_rules "V-257803") }}
  V-257809:
    name: kernel.randomize_va_space
    title: "RHEL 9 must implement address space layout randomization (ASLR) to protect its memory from unauthorized code execution."
    meta:
      stig_id: V-257809
    value: "2"
    skip: {{ not (index .Vars.enabled_rules "V-257809") }}
  V-257810:
    name: kernel.unprivileged_bpf_disabled
    title: "RHEL 9 must disable access to network bpf system call from nonprivileged processes."
    meta:
      stig_id: V-257810
    value: "1"
    skip: {{ not (index .Vars.enabled_rules "V-257810") }}
  V-257811:
    name: kernel.yama.ptrace_scope
    title: "RHEL 9 must restrict usage of ptrace to descendant processes."
    meta:
      stig_id: V-257811
    value: "1"
    skip: {{ not (index .Vars.enabled_rules "V-257811") }}
  V-257816:
    name: user.max_user_namespaces
    title: "RHEL 9 must disable the use of user namespaces."
    meta:
      stig_id: V-257816
    value: "0"
    skip: {{ not (index .Vars.enabled_rules "V-257816") }}
  V-257942:
    name: net.core.bpf_jit_harden
    title: "RHEL 9 must enable hardening for the Berkeley Packet Filter just-in-time compiler."
    meta:
      stig_id: V-257942
    value: "2"
    skip: {{ not (index .Vars.enabled_rules "V-257942") }}
