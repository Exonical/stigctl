command:
  V-258230:
    title: "RHEL 9 must enable FIPS mode."
    meta:
      stig_id: V-258230
    exec: "test \"$(cat /proc/sys/crypto/fips_enabled 2>/dev/null)\" = 1"
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258230") }}

  V-258236:
    title: "RHEL 9 cryptographic policy must not be overridden."
    meta:
      stig_id: V-258236
    exec: "update-crypto-policies --check"
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258236") }}

  V-258241:
    title: "RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy."
    meta:
      stig_id: V-258241
    exec: |
      policy="$(update-crypto-policies --show 2>/dev/null)" &&
      case "$policy" in FIPS|FIPS:*) ;; *) exit 1 ;; esac &&
      state=/etc/crypto-policies/state/CURRENT.pol &&
      test -r "$state" &&
      hash_line="$(grep -E '^[[:space:]]*hash[[:space:]]*=' "$state" | head -n1)" &&
      test -n "$hash_line" &&
      for alg in SHA2-224 SHA2-256 SHA2-384 SHA2-512 SHA3-256 SHA3-384 SHA3-512 SHAKE-256; do
        printf '%s\n' "$hash_line" | grep -qw "$alg" || exit 1
      done &&
      ! printf '%s\n' "$hash_line" | grep -Eq 'SHA1|MD5' &&
      rsa="$(awk -F= '/^[[:space:]]*min_rsa_size[[:space:]]*=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$state")" &&
      test -n "$rsa" &&
      test "$rsa" -ge 2048
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258241") }}

  V-270177:
    title: "The RHEL 9 SSH client must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections."
    meta:
      stig_id: V-270177
    exec: |
      grep -Eiq '^[[:space:]]*Ciphers[[:space:]]+aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr[[:space:]]*$'         /etc/crypto-policies/back-ends/openssh.config
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-270177") }}

  V-270178:
    title: "The RHEL 9 SSH client must be configured to use only DOD-approved Message Authentication Codes (MACs) employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections."
    meta:
      stig_id: V-270178
    exec: |
      grep -Eiq '^[[:space:]]*MACs[[:space:]]+hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512[[:space:]]*$'         /etc/crypto-policies/back-ends/openssh.config
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-270178") }}

  V-257989:
    title: "The RHEL 9 SSH server must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH server connections."
    meta:
      stig_id: V-257989
    exec: |
      grep -Eiq '^[[:space:]]*Ciphers[[:space:]]+aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr[[:space:]]*$'         /etc/crypto-policies/back-ends/opensshserver.config
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257989") }}

  V-257991:
    title: "The RHEL 9 SSH server must be configured to use only Message Authentication Codes (MACs) employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH server connections."
    meta:
      stig_id: V-257991
    exec: |
      grep -Eiq '^[[:space:]]*MACs[[:space:]]+hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512[[:space:]]*$'         /etc/crypto-policies/back-ends/opensshserver.config
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257991") }}

  V-258232:
    title: "RHEL 9 IP tunnels must use FIPS 140-3 approved cryptographic algorithms."
    meta:
      stig_id: V-258232
    exec: |
      if ! rpm -q libreswan >/dev/null 2>&1; then
        exit 0
      fi
      test -r /etc/ipsec.conf &&
      grep -Eq '^[[:space:]]*include[[:space:]]+/etc/crypto-policies/back-ends/libreswan\.config[[:space:]]*$' /etc/ipsec.conf
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258232") }}

  V-258242:
    title: "RHEL 9 must implement DOD-approved encryption in the bind package."
    meta:
      stig_id: V-258242
    exec: |
      if ! rpm -q bind >/dev/null 2>&1; then
        exit 0
      fi
      test -r /etc/named.conf &&
      grep -Eq '^[[:space:]]*include[[:space:]]+"/etc/crypto-policies/back-ends/bind\.config";[[:space:]]*$' /etc/named.conf
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258242") }}
