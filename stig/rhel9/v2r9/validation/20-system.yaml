command:
  V-257777:
    title: "RHEL 9 must be a vendor-supported release."
    meta:
      stig_id: V-257777
    exec: |
      test -r /etc/redhat-release &&
      grep -Eq '^Red Hat Enterprise Linux release 9([.][0-9]+)?([[:space:]]|$)' /etc/redhat-release
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257777") }}

  V-257784:
    title: "The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled."
    meta:
      stig_id: V-257784
    exec: |
      grep -RhsEi '^[[:space:]]*CtrlAltDelBurstAction[[:space:]]*=[[:space:]]*none[[:space:]]*$'         /etc/systemd/system.conf /etc/systemd/system.conf.d 2>/dev/null | grep -q .
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257784") }}

  V-257785:
    title: "The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9."
    meta:
      stig_id: V-257785
    exec: "test \"$(systemctl show ctrl-alt-del.target -p LoadState --value)\" = masked"
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257785") }}

  V-257955:
    title: "There must be no shosts.equiv files on RHEL 9."
    meta:
      stig_id: V-257955
    exec: "test -z \"$(find / -name shosts.equiv -type f -print -quit 2>/dev/null)\""
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257955") }}

  V-257956:
    title: "There must be no .shosts files on RHEL 9."
    meta:
      stig_id: V-257956
    exec: "test -z \"$(find / -name .shosts -type f -print -quit 2>/dev/null)\""
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257956") }}

  V-258059:
    title: "The root account must be the only account having unrestricted access to RHEL 9 system."
    meta:
      stig_id: V-258059
    exec: "test \"$(awk -F: '$3 == 0 {print $1}' /etc/passwd)\" = root"
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258059") }}

  V-258094:
    title: "RHEL 9 must not allow blank or null passwords."
    meta:
      stig_id: V-258094
    exec: "! grep -Eisq '(^|[[:space:]])nullok([[:space:]]|$)' /etc/pam.d/system-auth /etc/pam.d/password-auth"
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258094") }}

  V-257820:
    title: "RHEL 9 must check the GPG signature of software packages originating from external software repositories before installation."
    meta:
      stig_id: V-257820
    exec: |
      grep -Eq '^[[:space:]]*gpgcheck[[:space:]]*=[[:space:]]*1[[:space:]]*$' /etc/dnf/dnf.conf
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257820") }}

  V-257821:
    title: "RHEL 9 must check the GPG signature of locally installed software packages before installation."
    meta:
      stig_id: V-257821
    exec: |
      grep -Eq '^[[:space:]]*localpkg_gpgcheck[[:space:]]*=[[:space:]]*1[[:space:]]*$' /etc/dnf/dnf.conf
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257821") }}

  V-257822:
    title: "RHEL 9 must have GPG signature verification enabled for all software repositories."
    meta:
      stig_id: V-257822
    exec: |
      found=0
      for repo in /etc/yum.repos.d/*.repo; do
        test -e "$repo" || continue
        found=1
        awk '
          function finish_section() {
            if (in_section && !good) exit 1
          }
          /^[[:space:]]*\[[^]]+\][[:space:]]*$/ {
            finish_section()
            in_section=1
            good=0
            next
          }
          /^[[:space:]]*gpgcheck[[:space:]]*=/ {
            line=$0
            sub(/^[^=]*=/, "", line)
            gsub(/[[:space:]]/, "", line)
            if (line != "1") exit 1
            good=1
          }
          END { finish_section() }
        ' "$repo" || exit 1
      done
      test "$found" -eq 1
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257822") }}
