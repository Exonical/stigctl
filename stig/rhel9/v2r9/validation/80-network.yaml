      stig_id: V-257960
    value: "1"
    skip: {{ not (index .Vars.enabled_rules "V-257960") }}
  V-257961:
    name: net.ipv4.conf.default.log_martians
    title: "RHEL 9 must log IPv4 packets with impossible addresses by default."
