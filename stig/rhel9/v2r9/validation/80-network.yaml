      stig_id: V-257959
    value: "0"
    skip: {{ not (index .Vars.enabled_rules "V-257959") }}
  V-257960:
    name: net.ipv4.conf.all.log_martians
    title: "RHEL 9 must log IPv4 packets with impossible addresses."
