    skip: {{ not (index .Vars.enabled_rules "V-257962") }}
  V-257963:
    name: net.ipv4.conf.default.accept_redirects
    title: "RHEL 9 must prevent IPv4 Internet Control Message Protocol (ICMP) redirect messages from being accepted."
