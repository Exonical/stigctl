      stig_id: V-257963
    value: "0"
    skip: {{ not (index .Vars.enabled_rules "V-257963") }}
  V-257964:
    name: net.ipv4.conf.default.accept_source_route
    title: "RHEL 9 must not forward IPv4 source-routed packets by default."
