    skip: {{ not (index .Vars.enabled_rules "V-257917") }}

  V-257888:
    title: "RHEL 9 permissions of cron configuration files and directories must not be modified from operating system defaults."
    meta: { stig_id: V-257888 }
    exec: |
      rpm -V cronie crontabs 2>/dev/null |
        awk '$NF ~ "^/etc/(cron|crontab)" && substr($1,2,1) != "." { bad=1 } END { exit bad }'
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257888") }}

  V-257926:
    title: "RHEL 9 cron configuration files directory must be owned by root."
    meta: { stig_id: V-257926 }
    exec: |
      for path in /etc/cron.d /etc/cron.daily /etc/cron.hourly /etc/cron.monthly /etc/cron.weekly /etc/crontab; do
        test ! -e "$path" || test -z "$(find "$path" -xdev ! -user root -print -quit 2>/dev/null)" || exit 1
      done
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257926") }}

  V-257927:
    title: "RHEL 9 cron configuration files directory must be group-owned by root."
    meta: { stig_id: V-257927 }
    exec: |
      for path in /etc/cron.d /etc/cron.daily /etc/cron.hourly /etc/cron.monthly /etc/cron.weekly /etc/crontab; do
        test ! -e "$path" || test -z "$(find "$path" -xdev ! -group root -print -quit 2>/dev/null)" || exit 1
      done
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257927") }}

  V-257879:
    title: "RHEL 9 local disk partitions must implement cryptographic mechanisms for information requiring at-rest protection."
    meta:
      stig_id: V-257879
    exec: |
      src="$(findmnt -n -o SOURCE / 2>/dev/null)"
      test -n "$src" || exit 1
      case "$src" in
        /dev/*)
          lsblk -s -n -o TYPE "$src" 2>/dev/null | grep -qx crypt
          ;;
        *)
          exit 1
          ;;
      esac
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257879") }}
