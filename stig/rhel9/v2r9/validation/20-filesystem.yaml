command:
  V-257885:
    title: "RHEL 9 /var/log directory must have mode 0755 or less permissive."
    meta: { stig_id: V-257885 }
    exec: "test $(( 8#$(stat -c %a /var/log) & 8#0022 )) -eq 0"
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257885") }}

  V-257886:
    title: "RHEL 9 /var/log/messages file must have mode 0640 or less permissive."
    meta: { stig_id: V-257886 }
    exec: "test -e /var/log/messages && test $(( 8#$(stat -c %a /var/log/messages) & 8#0137 )) -eq 0"
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257886") }}

  V-257887:
    title: "RHEL 9 audit tools must have a mode of 0755 or less permissive."
    meta: { stig_id: V-257887 }
    exec: |
      found=0
      for tool in /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules; do
        test -e "$tool" || continue
        found=1
        test $(( 8#$(stat -c %a "$tool") & 8#0022 )) -eq 0 || exit 1
      done
      test "$found" -eq 1
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-257887") }}

