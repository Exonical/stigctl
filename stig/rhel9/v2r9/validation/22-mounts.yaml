      while read -r target opts; do test -n "$target" || continue; printf ',%s,' "$opts" | grep -q ',noexec,' || { bad="$target:$opts"; break; }; done < <(findmnt -rn -t nfs,nfs4 -o TARGET,OPTIONS 2>/dev/null)
