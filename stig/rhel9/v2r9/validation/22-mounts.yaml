  V-257857:
    title: "RHEL 9 must prevent code from being executed on file systems that are used with removable media."
    meta: { stig_id: V-257857 }
    exec: |
      bad=""
      while read -r name rm mnt; do test "$rm" = 1 || continue; test -n "$mnt" || continue; opts="$(findmnt -n -o OPTIONS --target "$mnt" 2>/dev/null || true)"; printf ',%s,' "$opts" | grep -q ',noexec,' || { bad="$name:$mnt:$opts"; break; }; done < <(lsblk -nrpo NAME,RM,MOUNTPOINT 2>/dev/null)
      echo "evidence=removable_noexec_violation=${bad:-none}"
      test -z "$bad"
    exit-status: 0
    stdout:
      - "evidence="
    skip: {{ not (index .Vars.enabled_rules "V-257857") }}

