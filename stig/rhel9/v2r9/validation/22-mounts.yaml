command:
  V-257843:
    title: "A separate RHEL 9 file system must be used for user home directories (such as /home or an equivalent)."
    meta: { stig_id: V-257843 }
    exec: |
      actual="$(findmnt -n -o TARGET --target '/home' 2>/dev/null || true)"
      echo "evidence=required_mount=/home actual=${actual:-none}"
      test "$actual" = '/home'
    exit-status: 0
    stdout:
      - "evidence="
    skip: {{ not (index .Vars.enabled_rules "V-257843") }}

