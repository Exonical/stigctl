  V-257849:
    title: "RHEL 9 file system automount function must be disabled unless required."
    meta: { stig_id: V-257849 }
    exec: |
      if ! rpm -q autofs >/dev/null 2>&1; then echo "evidence=autofs_installed=false"; exit 0; fi
      state="$(systemctl is-enabled autofs.service 2>/dev/null || true)"
      echo "evidence=autofs_state=$state"
      test "$state" != enabled
    exit-status: 0
    stdout:
      - "evidence="
    skip: {{ not (index .Vars.enabled_rules "V-257849") }}

  V-257850:
    title: "RHEL 9 must prevent device files from being interpreted on file systems that contain user home directories."
    meta: { stig_id: V-257850 }
    exec: |
      opts="$(findmnt -n -o OPTIONS --target '/home' 2>/dev/null || true)"
      echo "evidence=mount=/home options=${opts:-none}"
      test -n "$opts"
      printf ',%s,' "$opts" | grep -q ',nodev,'
    exit-status: 0
    stdout:
      - "evidence="
    skip: {{ not (index .Vars.enabled_rules "V-257850") }}

