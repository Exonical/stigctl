  V-257854:
    title: "RHEL 9 must prevent special devices on file systems that are imported via Network File System (NFS)."
    meta: { stig_id: V-257854 }
    exec: |
      bad=""
      while read -r target opts; do test -n "$target" || continue; printf ',%s,' "$opts" | grep -q ',nodev,' || { bad="$target:$opts"; break; }; done < <(findmnt -rn -t nfs,nfs4 -o TARGET,OPTIONS 2>/dev/null)
      echo "evidence=nfs_nodev_violation=${bad:-none}"
      test -z "$bad"
    exit-status: 0
    stdout:
      - "evidence="
    skip: {{ not (index .Vars.enabled_rules "V-257854") }}

  V-257855:
    title: "RHEL 9  must prevent code from being executed on file systems that are imported via Network File System (NFS)."
