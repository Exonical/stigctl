command:
  V-258143:
    title: "RHEL 9 rsyslog must not accept remote log messages unless acting as a log aggregator."
    meta: { stig_id: V-258143 }
    exec: |
      ! grep -REiq 'InputTCPServerRun|UDPServerRun|RELPServerRun|module\(load="imtcp"\)|module\(load="imudp"\)|module\(load="imrelp"\)|input\(type="imtcp"|input\(type="imudp"|input\(type="imrelp"' /etc/rsyslog.conf /etc/rsyslog.d 2>/dev/null
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258143") }}

  V-258144:
    title: "All RHEL 9 remote access methods must be monitored."
    meta: { stig_id: V-258144 }
    exec: "grep -REiq '(^|[;[:space:]])(auth|authpriv|daemon)\.\*' /etc/rsyslog.conf /etc/rsyslog.d 2>/dev/null"
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258144") }}

  V-258150:
    title: "RHEL 9 must use cron logging."
    meta: { stig_id: V-258150 }
    exec: "grep -REiq '^[[:space:]]*cron\.\*[[:space:]]+' /etc/rsyslog.conf /etc/rsyslog.d 2>/dev/null"
    exit-status: 0
    skip: {{ not (index .Vars.enabled_rules "V-258150") }}
