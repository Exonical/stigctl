# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.18.2/www/static/schema.json
version: 2

project_name: stigctl

before:
  hooks:
    - go mod tidy

builds:
  - id: stigctl
    main: ./cmd/stigctl
    binary: stigctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Exonical/stigctl/internal/version.Version={{ .Version }}
      - -X github.com/Exonical/stigctl/internal/version.Commit={{ .Commit }}
      - -X github.com/Exonical/stigctl/internal/version.Date={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: stigctl-archive
    ids:
      - stigctl
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - profiles/**/*
      - schemas/**/*
      - stig/**/*

  - id: stigctl-binary
    ids:
      - stigctl
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: Exonical
    name: stigctl
  draft: false
  prerelease: auto
  name_template: "stigctl {{ .Tag }}"
