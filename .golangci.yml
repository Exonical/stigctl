version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: standard
  disable:
    # Existing CLI output paths intentionally ignore writer errors in several
    # places. Re-enable once those call sites are refactored consistently.
    - errcheck
  enable:
    - errorlint
    - misspell
    - predeclared
    - unconvert

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
